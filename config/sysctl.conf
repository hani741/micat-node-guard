# Micat Node Guard 2.0
# Conservative baseline for Debian/Ubuntu proxy/edge nodes.
# No congestion-control algorithm is forced; no firewall rules are added.

# SYN queue / listen backlog
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 8192

# TCP keepalive and connection lifecycle
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_fin_timeout = 30

# Reuse TIME_WAIT sockets for new outgoing connections (Linux safe mode)
net.ipv4.tcp_tw_reuse = 1

# Socket memory ceilings; these are ceilings, not preallocated memory
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Disable source routing and ICMP redirects
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Ignore broadcast pings and bogus ICMP error responses
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Loose reverse-path filtering is more compatible with multihoming/policy routing
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# IPv6: disable redirects and source routing; IPv6 itself remains enabled
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# File handles / inotify
fs.file-max = 1048576
fs.inotify.max_user_instances = 65536

# Kernel information exposure / ASLR
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.randomize_va_space = 2
